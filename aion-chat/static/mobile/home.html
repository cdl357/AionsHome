<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b111f">
<title>回家 · Yuri &amp; Sean</title>
<link rel="stylesheet" href="/static/mobile/theme.css">
<script src="/static/mobile/theme.js"></script>
<script>window.MobileTheme && MobileTheme.boot();</script>
<script src="/static/relationship-days.js"></script>
<style>
  /* ── 首页专属布局 ── */
  .home-visual { margin-top: 8px; }
  .home-quote {
    margin: 16px 0 0;
    text-align: center;
    font-size: 14px;
    color: var(--text-2);
  }
  .continue-actions { display: flex; gap: 10px; margin-top: 16px; }
  .continue-actions .m-btn { flex: 1; }
  .continue-meta { display: flex; align-items: center; gap: 8px; margin-top: 10px;
                   font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
  #continueTitle {
    display: block; font-size: 16px; font-weight: 600; color: var(--text);
    text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
</style>
</head>
<body>
<main class="m-page">

  <!-- 1. 顶部：Yuri | 连接符号(待定，先占位) | Sean -->
  <header class="avatar-row">
    <button class="avatar-slot" id="yuriSlot" type="button" title="点头像换 Yuri 的照片">
      <span class="avatar" id="yuriAvatar">Y</span>
      <span class="name">Yuri</span>
      <span class="avatar-hint">点头像可换</span>
    </button>
    <span class="connect-sym" id="connectSym" title="连接符号（待定，占位）">×</span>
    <button class="avatar-slot" id="seanSlot" type="button" title="点头像换 Sean 的照片">
      <span class="avatar" id="seanAvatar">S</span>
      <span class="name">Sean</span>
      <span class="avatar-hint">点头像可换</span>
    </button>
    <input type="file" id="yuriFile" accept="image/*" hidden>
    <input type="file" id="seanFile" accept="image/*" hidden>
  </header>

  <!-- 2. 在一起天数（从 2026.07.09 起算） -->
  <section aria-label="在一起天数">
    <div class="days-row">
      <span class="m-hint">在一起的第</span><span class="num" id="dayNum">–</span><span class="unit">天</span>
    </div>
    <div class="days-since" id="daySince"></div>
  </section>

  <!-- 3. 今日情话 -->
  <p class="home-quote" id="homeQuote"></p>

  <!-- 4. 继续聊天（大按钮，线路 + 连接状态） -->
  <h2 class="m-section">继续聊天</h2>
  <div class="m-card" id="continueCard">
    <div class="m-empty" id="continueEmpty">还没有聊过天，从一句晚安开始吧</div>
    <div id="continueBody" hidden>
      <a id="continueTitle" href="/chat"></a>
      <div class="continue-meta">
        <span id="continueTime"></span>
        <span id="continueModel"></span>
      </div>
      <div class="continue-meta">
        <span class="m-dot" id="connDot"></span>
        <span id="connText"></span>
      </div>
      <div class="continue-actions">
        <a class="m-btn m-btn-primary" id="continueBtn" href="/chat">继续聊天</a>
        <a class="m-btn m-btn-ghost" href="/chat">新建聊天</a>
      </div>
    </div>
  </div>

  <!-- 5. 快捷入口方块 -->
  <h2 class="m-section">快捷入口</h2>
  <div class="quick-grid">
    <a class="quick-block" href="/m/album"><span class="ico">相册</span></a>
    <a class="quick-block" href="/m/board"><span class="ico">留言板</span></a>
    <a class="quick-block" href="/m/memories"><span class="ico">记忆库</span></a>
  </div>

  <!-- 6. 最近动态（最近日记 / 留言 / 照片；留言接口接入后自动出现） -->
  <h2 class="m-section">最近动态</h2>
  <div class="m-card" id="feedCard"><div class="m-empty">还没有留下新的回忆</div></div>

</main>

<!-- 底部导航：聊天 | 朋友圈 | 回家(中) | 我们 | 更多 -->
<nav class="m-nav" aria-label="主导航">
  <div class="m-nav-inner">
    <a href="/chat">聊天</a>
    <a href="/m/moments">朋友圈</a>
    <a href="/m/home" class="center-item active"><span class="ico">⌂</span>回家</a>
    <a href="/m/us">我们</a>
    <a href="/m/more">更多</a>
  </div>
</nav>

<div class="m-toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  function api(path) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 15000);
    return fetch(path, { signal: ctrl.signal }).then(function (res) {
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).catch(function (err) { clearTimeout(timer); throw err; });
  }

  function relTime(ts) {
    if (!ts) return '';
    var diff = Date.now() / 1000 - ts;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
    var d = new Date(ts * 1000);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showToast(text) {
    var el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ── 头像：真实图片，点头像随时能换（存 localStorage，图片由两人自己提供） ── */
  var AVATAR_KEYS = { yuri: 'aion_avatar_yuri', sean: 'aion_avatar_sean' };

  function renderAvatar(who) {
    var span = $(who + 'Avatar');
    var data = null;
    try { data = localStorage.getItem(AVATAR_KEYS[who]); } catch (e) {}
    if (data) {
      span.innerHTML = '';
      var img = document.createElement('img');
      img.alt = who === 'yuri' ? 'Yuri 的头像' : 'Sean 的头像';
      img.src = data;
      span.appendChild(img);
    } else {
      span.textContent = who === 'yuri' ? 'Y' : 'S';
    }
  }

  function bindAvatar(who) {
    var input = $(who + 'File');
    $(who + 'Slot').addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) { showToast('图片太大啦，换一张 3MB 以内的'); input.value = ''; return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          localStorage.setItem(AVATAR_KEYS[who], String(reader.result));
          renderAvatar(who);
          showToast('头像已经换好');
        } catch (e) { showToast('保存失败，图片可能太大'); }
      };
      reader.readAsDataURL(file);
      input.value = '';
    });
    renderAvatar(who);
  }
  bindAvatar('yuri');
  bindAvatar('sean');

  /* ── 在一起天数：从 2026.07.09 起算（布局定稿固定值，后期可改可配置） ── */
  var START_DATE = '2026-07-09';
  (function renderDays() {
    if (!window.relationshipDays) return;
    var a = window.relationshipDays.getRelationshipAnniversary(START_DATE);
    $('dayNum').textContent = a.day;
    $('daySince').textContent = '始于 ' + a.since;
  })();

  /* ── 今日情话：本地短句按日轮换（AI 状态接入后可替换） ── */
  var QUOTES = [
    '今晚的月亮也很想你。',
    '你回家的每一步，我都数着。',
    '茶已温好，故事随时开始。',
    '和你在一起的每一天都值得记下来。',
    '风很轻，适合说悄悄话。',
    '我把今天的心情折成了纸船。',
    '晚一点没关系，反正我一直在。',
    '今天的星星比昨天多了一颗。',
    '你笑起来的时候，家里就亮了。',
    '慢慢来，我们的日子还很长。'
  ];
  (function renderQuote() {
    var start = new Date(); start.setHours(0, 0, 0, 0);
    $('homeQuote').textContent = QUOTES[Math.floor(start.getTime() / 86400000) % QUOTES.length];
  })();

  /* ── 继续聊天：线路 + 订阅连接状态（只读） ── */
  var MODEL_PROVIDERS = {};
  var currentConv = null;
  var CODEX_STATUS_TEXT = {
    cli_missing: 'GPT/Codex 订阅：未安装',
    not_logged_in: 'GPT/Codex 订阅：未登录',
    logged_in: 'GPT/Codex 订阅：登录态存在',
    app_server_start_failed: 'GPT/Codex 订阅：启动失败',
    available: 'GPT/Codex 订阅：可用'
  };
  var CODEX_STATUS_DOT = {
    cli_missing: '', not_logged_in: 'm-dot-pending',
    logged_in: 'm-dot-ok', app_server_start_failed: 'm-dot-danger',
    available: 'm-dot-ok'
  };
  function providerLabel(modelKey) {
    var cfg = MODEL_PROVIDERS[modelKey];
    if (!cfg) return modelKey || '';
    if (cfg.provider === 'codex_cli') return modelKey + ' · GPT/Codex 订阅';
    if (cfg.provider === 'custom_openai') return modelKey + ' · ' + (cfg.route_name || 'API Key 线路');
    return modelKey + ' · API Key';
  }
  function renderContinue(conv) {
    currentConv = conv;
    $('continueEmpty').hidden = true;
    $('continueBody').hidden = false;
    $('continueTitle').textContent = conv.title || '未命名聊天';
    $('continueTime').textContent = relTime(conv.updated_at);
    $('continueTitle').href = '/chat?conv=' + encodeURIComponent(conv.id);
    $('continueBtn').href = '/chat?conv=' + encodeURIComponent(conv.id);
    $('continueModel').textContent = providerLabel(conv.model);
  }
  function renderConn(status, statusText) {
    $('connDot').className = 'm-dot ' + (CODEX_STATUS_DOT[status] || '');
    $('connText').textContent = CODEX_STATUS_TEXT[status] || statusText || '';
  }

  function renderItem(href, title, sub, tagText, tagClass) {
    return '<a class="m-item" href="' + esc(href) + '">' +
      '<span class="grow"><span class="t">' + esc(title) + '</span>' +
      (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</span>' +
      (tagText ? '<span class="m-tag ' + (tagClass || '') + '">' + esc(tagText) + '</span>' : '') +
      '</a>';
  }

  /* ── 最近动态：最近日记 / 留言 / 照片（留言接口接入后自动并入） ── */
  function renderFeed(diaries, photos) {
    var entries = [];
    (diaries || []).forEach(function (d) {
      entries.push({ ts: d.created_at, href: '/diary', tag: '日记', tagClass: 'm-tag-lilac',
        text: (d.title || d.content || '').replace(/\s+/g, ' ').slice(0, 60) || '写了一篇日记' });
    });
    (photos || []).forEach(function (p) {
      entries.push({ ts: p.created_at || p.taken_at, href: '/album', tag: '相册',
        text: p.title || p.note || '存下了一张照片' });
    });
    entries.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    var top = entries.slice(0, 5);
    if (top.length) {
      $('feedCard').innerHTML = top.map(function (e) {
        return renderItem(e.href, e.text, relTime(e.ts), e.tag, e.tagClass);
      }).join('');
    }
  }

  /* ── 并行加载，任何失败都只落在空状态 ── */
  function load() {
    api('/api/conversations').then(function (list) {
      list = Array.isArray(list) ? list : [];
      if (list.length) renderContinue(list[0]);
    }).catch(function () {});
    api('/api/models').then(function (rows) {
      (rows || []).forEach(function (r) { MODEL_PROVIDERS[r.key] = r; });
      if (currentConv) $('continueModel').textContent = providerLabel(currentConv.model);
    }).catch(function () {});
    api('/api/codex/status').then(function (s) { renderConn(s.status, s.status_text); }).catch(function () {});
    Promise.all([
      api('/api/diaries?page=1&page_size=6').then(function (d) { return (d && d.items) || []; }).catch(function () { return []; }),
      api('/api/album/photos?offset=0&limit=6').then(function (d) { return (d && d.photos) || []; }).catch(function () { return []; })
    ]).then(function (r) { renderFeed(r[0], r[1]); });
  }
  load();
})();
</script>
</body>
</html>
