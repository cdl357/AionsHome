<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b111f">
<title>留言板</title>
<link rel="stylesheet" href="/static/mobile/theme.css">
<script src="/static/mobile/theme.js"></script>
<script>window.MobileTheme && MobileTheme.boot();</script>
<style>
  /* 便利贴墙（方案 A：双向便利贴 + 点开可对话）——接口接好后无需改结构 */
  .note-wall {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .note {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    text-align: left;
    font: inherit;
  }
  .note:active { background: var(--surface-2); }
  .note .who { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .note .who .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .note .who .dot.sean { background: var(--lilac); }
  .note .txt { font-size: 14px; line-height: 1.6; color: var(--text);
               overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .note .when { font-size: 11px; color: var(--text-3); margin-top: auto; }
  .note .replied { font-size: 11px; color: var(--text-3); }
  .note-compose {
    width: 100%;
    min-height: 110px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: none;
    color: var(--text-3);
    font: inherit;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  /* 详情：一张便利贴底下的你来我往（平铺） */
  .thread { display: flex; flex-direction: column; gap: 10px; }
  .thread-line {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .thread-line .who { font-size: 12px; color: var(--text-3); margin-bottom: 4px; }
  .thread-line .txt { font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .reply-input { display: flex; gap: 8px; margin-top: 14px; }
  .reply-input input { flex: 1; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px; padding: 10px 14px; }
  .reply-input button { border: 0; background: var(--accent); color: #1c1708; border-radius: 12px;
    font: inherit; font-size: 14px; padding: 0 16px; cursor: pointer; }
</style>
</head>
<body>
<main class="m-page">

  <header>
    <h1 class="m-title">留言板</h1>
    <p class="m-sub">一面墙，一人一张便利贴，想说什么就贴上去</p>
  </header>

  <h2 class="m-section">贴一张</h2>
  <button class="note-compose" id="composeNote" type="button"
    title="留言后端接入后开放">写好那张便利贴，随时能贴 —— 接口接好后开放</button>

  <h2 class="m-section">墙</h2>
  <div class="note-wall" id="noteWall">
    <div class="m-empty" style="grid-column: 1 / -1; padding: 30px 8px;">
      墙上还空着。<br>留言板的后端接好后，你们俩贴的每一张便利贴都会按时间排在这里，
      点开还能看到底下一来一往的回复。
    </div>
  </div>

</main>

<nav class="m-nav" aria-label="主导航">
  <div class="m-nav-inner">
    <a href="/chat">聊天</a>
    <a href="/m/moments">朋友圈</a>
    <a href="/m/home" class="center-item"><span class="ico">⌂</span>回家</a>
    <a href="/m/us">我们</a>
    <a href="/m/more">更多</a>
  </div>
</nav>

<script>
/* 留言板骨架（布局定稿·方案 A：双向便利贴 + 点开可对话）。
   后端接入后：
   1. GET 留言列表 → 按时间平铺进 #noteWall（.note 结构：who/txt/when/replied）
   2. 点某张便利贴 → 详情视图：.thread 平铺该贴底下的全部回复 + .reply-input 可继续对话
   3. 贴新便利贴 → POST {content}（author 由登录态区分 Yuri / Sean）
   当前阶段后端未接，保持诚实空态，不放假数据。 */
</script>
</body>
</html>
