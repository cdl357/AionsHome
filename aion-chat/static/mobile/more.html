<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var T = window.MobileTheme;
  if (!T) return;

  /* ── 现成主题一键换色 ── */
  var chips = $('presetChips');
  var state = T.current() || {};
  chips.innerHTML = T.PRESET_ORDER.map(function (key) {
    var p = T.PRESETS[key];
    var active = state.preset === key && !state.custom;
    return '<button type="button" class="chip' + (active ? ' active' : '') + '" data-key="' + key + '">' +
           '<span class="sw" style="background:' + p.vars['--accent'] + '"></span>' + p.name + '</button>';
  }).join('');

  chips.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.chip');
    if (!btn) return;
    T.applyPreset(btn.dataset.key);
    markActive('preset:' + btn.dataset.key);
  });

  /* ── 调色盘：单主色自动配 ── */
  $('customColor').addEventListener('input', function () {
    if (T.applyCustom(this.value)) markActive('custom');
  });

  function markActive(which) {
    var list = chips.querySelectorAll('.chip');
    for (var i = 0; i < list.length; i++) {
      var k = list[i].getAttribute('data-key');
      list[i].classList.toggle('active', which === 'preset:' + k);
    }
    if (which === 'custom') {
      for (var j = 0; j < list.length; j++) list[j].classList.remove('active');
    }
  }
})();
</script>
