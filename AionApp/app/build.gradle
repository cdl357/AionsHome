plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aion.chat'
    compileSdk 34

    defaultConfig {
        applicationId "com.aion.chat"
        minSdk 24
        targetSdk 34
        versionCode 23
        versionName "1.22"

        // 从 local.properties 读取敏感配置
        Properties properties = new Properties()
        if (rootProject.file('local.properties').exists()) {
            properties.load(rootProject.file('local.properties').newDataInputStream())
        }
        
        buildConfigField "String", "SUPABASE_URL", "\"${properties.getProperty('supabase.url', 'https://byqqwypdfiwvalozihgs.supabase.co')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${properties.getProperty('supabase.anon.key', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    // 临时排除 widget 包（等数据层完善后再启用）
    sourceSets {
        main {
            java {
                exclude '**/widget/**'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

