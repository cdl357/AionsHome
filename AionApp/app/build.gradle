plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ── 固定签名 ──
// 从 AionApp/keystore.properties 读取（该文件不入库，见 keystore.properties.example）
// debug 与 release 共用同一 keystore，覆盖安装不再要求先卸载
// （签名不一致会报 INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.aion.chat'
    compileSdk 36

    defaultConfig {
        applicationId "com.aion.chat"
        minSdk 24
        targetSdk 34
        versionCode 71
        versionName "0.3.76"
    }

    signingConfigs {
        aion {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) {
                signingConfig signingConfigs.aion
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasKeystore ? signingConfigs.aion : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
     coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // Compose（新版回家前端）
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended:1.7.3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Haze 液态玻璃（回家页：折射 + 通透 + 边缘高光）
    implementation 'dev.chrisbanes.haze:haze:1.6.10'
    implementation 'dev.chrisbanes.haze:haze-materials:1.6.10'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
