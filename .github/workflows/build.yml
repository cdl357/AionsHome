name: Build AionChat (signed release)

on:
  push:
    branches: [ fix/safe-mode-reachable ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore keystore from Secret
        run: |
          cd AionApp
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > aion-release.jks
          cat > keystore.properties <<EOF
          storeFile=aion-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Create local.properties
        run: |
          cd AionApp
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Grant execute permission for gradlew
        run: |
          cd AionApp
          chmod +x gradlew

      - name: Build Release APK
        run: |
          cd AionApp
          ./gradlew assembleRelease --stacktrace

      - name: Scrub secrets from workspace
        if: always()
        run: |
          cd AionApp
          rm -f aion-release.jks keystore.properties local.properties

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AionChat-release
          path: AionApp/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd AionApp/app/build/outputs/apk/release
          APK=$(ls *.apk | head -1)
          VN=$(grep -E 'versionName' ../../../../../../app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          VC=$(grep -E 'versionCode' ../../../../../../app/build.gradle | sed 's/[^0-9]*\([0-9]*\).*/\1/')
          OUT="AionChat-${VN}-${VC}.apk"
          cp "$APK" "$OUT"
          TAG="v${VN}+${VC}"
          cd ../../../../../..
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "AionApp/app/build/outputs/apk/release/$OUT" \
            --title "AionChat $VN ($VC)" \
            --notes "自动构建 #${{ github.run_number }}。versionCode $VC，固定签名。直接下载 apk 安装；首次从旧签名切换需先卸载一次。"
