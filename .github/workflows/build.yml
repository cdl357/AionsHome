name: Build Android APK

on:
  push:
    branches:
      - mobile-companion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: mobile-companion
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Create local.properties
        run: |
          cd AionApp
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" > local.properties
          echo "supabase.anon.key=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
      
      - name: Grant execute permission for gradlew
        run: |
          cd AionApp
          chmod +x gradlew
      
      - name: Build Debug APK
        run: |
          cd AionApp
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: AionApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Get commit message
        id: commit
        run: echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT
      
      - name: Create Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: auto-${{ github.run_number }}
          name: "自动构建 #${{ github.run_number }}"
          body: |
            **提交信息**: ${{ steps.commit.outputs.message }}
            **构建时间**: ${{ github.event.head_commit.timestamp }}
            **分支**: mobile-companion
            
            ### 📱 安装方法
            1. 下载下面的 `app-debug.apk`
            2. 传到手机上安装
            3. 如果提示"未知来源"，需要在设置里允许安装
          files: AionApp/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
