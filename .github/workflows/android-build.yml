name: Build AionApp APK

# 手动触发即可出包；同时在 AionApp 改动推送到 main 时自动跑一次。
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        type: choice
        default: release
        options: [release, debug]
  push:
    branches: [main]
    paths:
      - 'AionApp/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AionApp

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # keystore 不入库，从仓库 Secrets 还原，保证每次出包签名一致
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 Secret，无法用固定签名出包"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > aion-release.jks
          cat > keystore.properties <<EOF
          storeFile=aion-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        run: |
          BT='${{ inputs.build_type }}'
          BT="${BT:-release}"
          case "$BT" in
            debug) ./gradlew --no-daemon assembleDebug ;;
            *)     ./gradlew --no-daemon assembleRelease ;;
          esac

      - name: Verify APK signature
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            | grep -E 'SHA-256|Signer' || true
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" \
            | grep -E "package: name" || true

      # keystore 与明文密码不能留在 runner 工作区
      - name: Scrub secrets from workspace
        if: always()
        run: rm -f aion-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: AionChat-apk
          path: AionApp/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
