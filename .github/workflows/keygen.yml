name: Generate Release Keystore (one-off)

# 一次性工具：生成正式签名用的 keystore，把 base64 打到日志里。
# 你复制日志里那一长串，存成仓库 Secret: RELEASE_KEYSTORE_B64
# 存完之后这个 workflow 就可以删掉，别重复跑——每跑一次都是一把新 key，
# 换 key 就等于又要卸载重装一次。
on:
  workflow_dispatch:

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -alias aionshome \
            -storepass aionshome2026 \
            -keypass aionshome2026 \
            -dname "CN=AionsHome, OU=Personal, O=AionsHome, L=None, ST=None, C=CN"

      - name: Print fingerprint
        run: |
          keytool -list -v -keystore release.jks -storepass aionshome2026 \
            | grep -E "SHA256:|Alias name:|Valid from"

      - name: Print base64 (copy this into Secret RELEASE_KEYSTORE_B64)
        run: |
          echo "=============== BASE64 START ==============="
          base64 -w 0 release.jks
          echo ""
          echo "=============== BASE64 END ================="
